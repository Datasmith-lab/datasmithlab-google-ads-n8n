<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc"><title id="title">Google Ads starter setup reference</title><desc id="desc">Illustrated setup reference using only placeholder credentials. Not an account screenshot.</desc><rect width="1100" height="430" rx="16" fill="#101924"/><text x="30" y="52" fill="#80d6ff" font-family="sans-serif" font-size="28">Google Ads → Sheets · setup reference</text><text x="30" y="100" fill="#e9f0f8" font-family="sans-serif" font-size="20">1. Ads tab: paste the CSV header row into A1</text><text x="30" y="140" fill="#e9f0f8" font-family="sans-serif" font-size="20">2. Configuration: spreadsheetId = REPLACE_WITH_SPREADSHEET_ID</text><text x="30" y="180" fill="#e9f0f8" font-family="sans-serif" font-size="20">   actorInput: domain nike.com · region US · maxItems 20</text><text x="30" y="220" fill="#e9f0f8" font-family="sans-serif" font-size="20">3. Header Auth: Authorization = Bearer YOUR_APIFY_TOKEN</text><text x="30" y="260" fill="#e9f0f8" font-family="sans-serif" font-size="20">   Connect Google Sheets OAuth2 on both Sheets nodes</text><text x="30" y="300" fill="#e9f0f8" font-family="sans-serif" font-size="20">4. Manual run twice: inspect reports, keys and firstSeenAt</text><text x="30" y="340" fill="#e9f0f8" font-family="sans-serif" font-size="20">   Keep Execute Once enabled; activate schedule only after checks</text></svg>